name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12" # Fixed from 8.13 (8.13 doesn't exist)

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.12

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"

      # This step creates a Release and uploads the APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          # If pushed via tag, use the tag name. Otherwise, auto-generate a version based on build number
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          files: |
            **/build/outputs/apk/debug/*.apk